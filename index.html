<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My CodePen Premium (Manager Mode)</title>
<style>
  :root { --bg-color: #131417; --panel-bg: #1d1e22; --text-color: #ffffff; --border-color: #34363e; }
  body { margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text-color); }
  
  header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; padding: 10px 20px; background-color: #000000; border-bottom: 1px solid var(--border-color); gap: 10px; }
  .title-area { display: flex; align-items: center; gap: 8px; }
  .title-area h1 { margin: 0; font-size: 20px; letter-spacing: 1px; color: #fff; margin-right: 10px;}
  
  input, select { background: #252526; color: #fff; border: 1px solid var(--border-color); padding: 5px 10px; border-radius: 4px; font-size: 13px; }
  input::placeholder { color: #666; }
  
  .storage-area { display: flex; align-items: center; gap: 5px; }
  
  .buttons { display: flex; align-items: center; gap: 5px; flex-wrap: wrap;}
  .buttons button { background-color: #444857; color: #fff; border: none; padding: 7px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 12px; }
  .buttons button:hover { opacity: 0.8; }
  
  .btn-save { background-color: #007acc !important; }
  .btn-google { background-color: #ffffff !important; color: #757575 !important; display: flex; align-items: center; gap: 5px; border: 1px solid #ccc !important; font-size: 13px !important; padding: 6px 12px !important; }
  .btn-delete { background-color: #ff3c41 !important; }
  .btn-logout { background-color: #555 !important; }
  .btn-import { background-color: #6a1b9a !important; }
  .btn-export { background-color: #fbc02d !important; color: #000 !important; }
  .btn-share { background-color: #ff9900 !important; color: #000 !important; font-size: 14px !important; padding: 7px 16px !important; }
  .btn-app { background-color: #47cf73 !important; color: #000 !important; }

  .editors-container { display: flex; height: 45vh; border-bottom: 8px solid var(--border-color); }
  .editor { flex: 1; display: flex; flex-direction: column; border-right: 1px solid var(--border-color); background-color: var(--panel-bg); }
  .editor-header { padding: 8px 15px; background-color: #1d1e22; font-size: 12px; font-weight: bold; border-top: 3px solid; color: #aaaebc; }
  .html-header { border-color: #ff3c41; } .css-header { border-color: #0ebeff; } .js-header { border-color: #fcd000; }
  textarea { flex: 1; background-color: var(--panel-bg); color: #a9b7c6; border: none; padding: 15px; font-family: 'Consolas', monospace; font-size: 14px; resize: none; outline: none; line-height: 1.5; }
  .preview-container { flex: 1; background-color: #fff; display: flex; }
  iframe { width: 100%; height: 100%; border: none; }

  body.full-screen-mode header, body.full-screen-mode .editors-container { display: none !important; }
  body.full-screen-mode .preview-container { height: 100vh; }
</style>
</head>
<body>

<header id="main-header">
  <div class="title-area">
    <h1>MyPen</h1>
    
    <div id="login-box" style="display:flex; gap:5px;">
      <button class="btn-google" onclick="loginWithGoogle()">
        <svg width="14" height="14" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Googleでログイン
      </button>
    </div>

    <div id="user-box" style="display:none; gap:5px; align-items:center;">
      <input type="text" id="project-folder" value="一般" placeholder="フォルダ名" style="width:90px; text-align: center; border-color: #ff9900;">
      <span style="color:#aaa;">/</span>
      <input type="text" id="project-title" value="無題の作品" placeholder="作品タイトル" style="width:130px;">
      <button class="btn-save" onclick="saveToCloud()">☁️ クラウド保存</button>
      <button class="btn-logout" onclick="logout()">ログアウト</button>
    </div>
  </div>
  
  <div class="storage-area">
    <select id="filter-folder" onchange="renderFilteredList()" style="border-color: #6a1b9a;">
      <option value="all">📁 全てのフォルダ</option>
    </select>
    <select id="sort-type" onchange="renderFilteredList()">
      <option value="date-desc">🕒 新しい順</option>
      <option value="date-asc">🕒 古い順</option>
      <option value="title-asc">🔤 名前順</option>
    </select>
    <select id="project-list" onchange="loadFromCloud(this.value)" style="width:180px; font-weight: bold;">
      <option value="">-- ログインしてください --</option>
    </select>
    <button class="btn-delete" onclick="deleteFromCloud()">消去</button>
  </div>

  <div class="buttons">
    <button class="btn-import" onclick="document.getElementById('import-file').click()">📂 読込</button>
    <input type="file" id="import-file" style="display:none" accept=".json" onchange="importProject(event)">
    <button class="btn-export" onclick="exportProject()">📦 書出</button>
    <button class="btn-share" onclick="generateShortUrl()">🚀 児童用URLを発行</button>
    <button class="btn-app" onclick="downloadApp()">🌐 アプリ保存</button>
  </div>
</header>

<div class="editors-container">
  <div class="editor"><div class="editor-header html-header">HTML</div><textarea id="html-code" oninput="updatePreview()" placeholder="<h1>学習ドリル</h1>"></textarea></div>
  <div class="editor"><div class="editor-header css-header">CSS</div><textarea id="css-code" oninput="updatePreview()" placeholder="h1 { color: #333; }"></textarea></div>
  <div class="editor"><div class="editor-header js-header">JS</div><textarea id="js-code" oninput="updatePreview()" placeholder="console.log('準備完了！');"></textarea></div>
</div>

<div class="preview-container"><iframe id="preview"></iframe></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, doc, setDoc, getDoc, collection, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDY9664KdW_xp_1psH007rQQgkBubkrKRo",
    authDomain: "mycodepen-db.firebaseapp.com",
    projectId: "mycodepen-db",
    storageBucket: "mycodepen-db.firebasestorage.app",
    messagingSenderId: "527917041450",
    appId: "1:527917041450:web:0f37dc7e6cd8cc9bf6c053"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();
  
  let currentUser = null;
  let allRawProjects = []; // 取得した全データを一時保管する配列

  window.updatePreview = function() {
    const h = document.getElementById('html-code').value;
    const c = "<style>" + document.getElementById('css-code').value + "</style>";
    const j = "<script>" + document.getElementById('js-code').value + "<\/script>";
    document.getElementById('preview').srcdoc = h + c + j;
  };

  // --- ログイン・ログアウト管理 ---
  onAuthStateChanged(auth, (user) => {
    if (user) {
      currentUser = user;
      document.getElementById('login-box').style.display = 'none';
      document.getElementById('user-box').style.display = 'flex';
      fetchCloudData();
    } else {
      currentUser = null;
      document.getElementById('login-box').style.display = 'flex';
      document.getElementById('user-box').style.display = 'none';
      document.getElementById('project-list').innerHTML = '<option value="">-- ログインしてください --</option>';
      document.getElementById('filter-folder').innerHTML = '<option value="all">📁 全てのフォルダ</option>';
      allRawProjects = [];
    }
  });

  window.loginWithGoogle = async function() {
    try { await signInWithPopup(auth, provider); } catch(e) { alert('ログイン失敗'); }
  };
  window.logout = function() { signOut(auth); };

  // ==========================================
  // クラウド保存（フォルダー情報と詳細タイムスタンプ付き）
  // ==========================================
  window.saveToCloud = async function() {
    if(!currentUser) return alert('ログインが必要です。');
    const folder = document.getElementById('project-folder').value.trim() || '一般';
    const title = document.getElementById('project-title').value.trim() || '無題の作品';
    const h = document.getElementById('html-code').value;
    const c = document.getElementById('css-code').value;
    const j = document.getElementById('js-code').value;
    
    try {
      await setDoc(doc(db, "users", currentUser.uid, "my_projects", title), {
        html: h, css: c, js: j,
        folder: folder,
        updatedStr: new Date().toLocaleTimeString(),
        timestamp: new Date().getTime() // 並び替え用の正確なタイムスタンプ
      });
      alert(`フォルダー「${folder}」内に「${title}」を保存しました！`);
      fetchCloudData();
    } catch (e) { alert('保存エラー: ' + e.message); }
  };

  // ==========================================
  // データの一括取得と管理処理
  // ==========================================
  async function fetchCloudData() {
    if(!currentUser) return;
    allRawProjects = [];
    const folderSelect = document.getElementById('filter-folder');
    const currentFolderFilter = folderSelect.value; // 現在の選択を維持
    
    const querySnapshot = await getDocs(collection(db, "users", currentUser.uid, "my_projects"));
    let folderSet = new Set();

    querySnapshot.forEach((doc) => {
      const data = doc.data();
      allRawProjects.push({
        id: doc.id,
        title: doc.id,
        folder: data.folder || '一般',
        html: data.html || '',
        css: data.css || '',
        js: data.js || '',
        updatedStr: data.updatedStr || '',
        timestamp: data.timestamp || 0
      });
      folderSet.add(data.folder || '一般');
    });

    // フォルダ選択プルダウンの再構築
    folderSelect.innerHTML = '<option value="all">📁 全てのフォルダ</option>';
    folderSet.forEach(f => {
      const option = document.createElement('option');
      option.value = f;
      option.textContent = `📁 ${f}`;
      if(f === currentFolderFilter) option.selected = true;
      folderSelect.appendChild(option);
    });

    renderFilteredList();
  }

  // ==========================================
  // フィルター・ソート・optgroupによる描画の実行
  // ==========================================
  window.renderFilteredList = function() {
    const filterFolder = document.getElementById('filter-folder').value;
    const sortType = document.getElementById('sort-type').value;
    const projectSelect = document.getElementById('project-list');
    
    projectSelect.innerHTML = '<option value="">-- クラウドから開く --</option>';

    // 1. フォルダで絞り込み
    let filtered = allRawProjects.filter(p => {
      if (filterFolder === 'all') return true;
      return p.folder === filterFolder;
    });

    // 2. 指定の条件で並び替え
    filtered.sort((a, b) => {
      if (sortType === 'date-desc') return b.timestamp - a.timestamp; // 新しい順
      if (sortType === 'date-asc') return a.timestamp - b.timestamp;  // 古い順
      if (sortType === 'title-asc') return a.title.localeCompare(b.title); // 名前順
      return 0;
    });

    // 3. フォルダごとに構造化して表示 (optgroupの作成)
    if (filterFolder !== 'all') {
      // 単一フォルダ表示の時はグループ分け不要
      filtered.forEach(p => {
        const option = document.createElement('option');
        option.value = p.id;
        option.textContent = `${p.title} (${p.updatedStr})`;
        projectSelect.appendChild(option);
      });
    } else {
      // 全表示の時はフォルダごとに綺麗に分ける
      let groups = {};
      filtered.forEach(p => {
        if (!groups[p.folder]) groups[p.folder] = [];
        groups[p.folder].push(p);
      });

      for (const folderName in groups) {
        const groupTag = document.createElement('optgroup');
        groupTag.label = `📂 ${folderName}`;
        
        groups[folderName].forEach(p => {
          const option = document.createElement('option');
          option.value = p.id;
          option.textContent = `${p.title} (${p.updatedStr})`;
          groupTag.appendChild(option);
        });
        projectSelect.appendChild(groupTag);
      }
    }
  };

  window.loadFromCloud = async function(title) {
    if (!title || !currentUser) return;
    const project = allRawProjects.find(p => p.id === title);
    if (project) {
      document.getElementById('project-folder').value = project.folder;
      document.getElementById('project-title').value = project.title;
      document.getElementById('html-code').value = project.html;
      document.getElementById('css-code').value = project.css;
      document.getElementById('js-code').value = project.js;
      window.updatePreview();
    }
  };

  window.deleteFromCloud = async function() {
    const select = document.getElementById('project-list');
    const title = select.value;
    if (!title || !currentUser) return alert('作品を選んでください。');
    if (confirm(`「${title}」をクラウドから完全に削除しますか？`)) {
      await deleteDoc(doc(db, "users", currentUser.uid, "my_projects", title));
      fetchCloudData();
      alert('削除しました。');
    }
  };

  // --- 共有・配布機能（変更なし） ---
  window.generateShortUrl = async function() {
    const h = document.getElementById('html-code').value;
    const c = document.getElementById('css-code').value;
    const j = document.getElementById('js-code').value;
    let baseUrl = window.location.href.split('?')[0];
    if(baseUrl.includes('github.dev')) return alert('正規のURL上で実行してください。');
    const shortId = Math.random().toString(36).substring(2, 8);
    try {
      await setDoc(doc(db, "shared_projects", shortId), { html: h, css: c, js: j });
      await navigator.clipboard.writeText(baseUrl + '?id=' + shortId);
      alert('児童用URLをコピーしました！');
    } catch(e) { alert('URL発行エラー'); }
  };

  window.exportProject = function() {
    const data = { title: document.getElementById('project-title').value, html: document.getElementById('html-code').value, css: document.getElementById('css-code').value, js: document.getElementById('js-code').value };
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' })); a.download = (data.title || 'project') + '.json'; a.click();
  };

  window.importProject = function(event) {
    const file = event.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      try { const d = JSON.parse(e.target.result); document.getElementById('project-title').value = d.title||''; document.getElementById('html-code').value = d.html||''; document.getElementById('css-code').value = d.css||''; document.getElementById('js-code').value = d.js||''; window.updatePreview(); } catch(err){ alert('読込失敗'); }
    }; reader.readAsText(file); event.target.value = '';
  };

  window.downloadApp = function() {
    const h = document.getElementById('html-code').value, c = document.getElementById('css-code').value, j = document.getElementById('js-code').value;
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([`<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><title>App</title><style>${c}</style></head><body>${h}<script>${j}<\/script></body></html>`], { type: 'text/html' })); a.download = (document.getElementById('project-title').value || 'app') + '.html'; a.click();
  };

  window.onload = async function() {
    const id = new URLSearchParams(window.location.search).get('id');
    if (id) {
      document.body.classList.add('full-screen-mode');
      try {
        const docSnap = await getDoc(doc(db, "shared_projects", id));
        if (docSnap.exists()) {
          const d = docSnap.data();
          document.getElementById('preview').srcdoc = (d.html||'') + "<style>" + (d.css||'') + "</style><script>" + (d.js||'') + "<\/script>";
        } else { document.body.innerHTML = '<h2 style="color:white;text-align:center;">データが見つかりません。</h2>'; }
      } catch (e) { document.body.innerHTML = '<h2 style="color:white;text-align:center;">通信エラー</h2>'; }
    } else {
      window.updatePreview();
    }
  };
</script>
</body>
</html>
