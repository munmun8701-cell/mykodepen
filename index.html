<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My CodePen Premium</title>
<style>
  /* 全体のテーマとカラー設定 */
  :root {
    --bg-color: #131417; 
    --panel-bg: #1d1e22; 
    --text-color: #ffffff; 
    --border-color: #34363e;
  }
  body {
    margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: var(--bg-color); color: var(--text-color);
  }

  /* ヘッダーのレイアウト */
  header {
    display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
    padding: 10px 20px; background-color: #000000; border-bottom: 1px solid var(--border-color); gap: 10px;
  }
  .title-area { display: flex; align-items: center; gap: 10px; }
  .title-area h1 { margin: 0; font-size: 20px; letter-spacing: 1px; color: #fff;}
  .title-area input {
    background: #252526; color: #fff; border: 1px solid var(--border-color);
    padding: 5px 10px; border-radius: 4px; font-size: 14px; width: 140px;
  }
  
  .storage-area { display: flex; align-items: center; gap: 5px; }
  .storage-area select {
    background: #252526; color: #fff; border: 1px solid var(--border-color);
    padding: 5px; border-radius: 4px; max-width: 150px; font-size: 13px;
  }

  /* ボタンのデザイン */
  .buttons { display: flex; align-items: center; gap: 5px; flex-wrap: wrap;}
  .buttons button {
    background-color: #444857; color: #fff; border: none; padding: 7px 12px;
    border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 12px;
  }
  .buttons button:hover { opacity: 0.8; }
  
  .btn-save { background-color: #007acc !important; }
  .btn-delete { background-color: #ff3c41 !important; }
  .btn-import { background-color: #6a1b9a !important; }
  .btn-export { background-color: #fbc02d !important; color: #000 !important; }
  .btn-share { background-color: #ff9900 !important; color: #000 !important; }
  .btn-app { background-color: #47cf73 !important; color: #000 !important; }

  /* エディター部分（HTML, CSS, JS）のレイアウト */
  .editors-container {
    display: flex; height: 45vh; border-bottom: 8px solid var(--border-color);
  }
  .editor {
    flex: 1; display: flex; flex-direction: column; border-right: 1px solid var(--border-color);
    background-color: var(--panel-bg);
  }
  .editor:last-child { border-right: none; }
  
  .editor-header {
    padding: 8px 15px; background-color: #1d1e22; font-size: 12px; font-weight: bold; border-top: 3px solid; color: #aaaebc;
  }
  .html-header { border-color: #ff3c41; }
  .css-header { border-color: #0ebeff; }
  .js-header { border-color: #fcd000; }
  
  textarea {
    flex: 1; background-color: var(--panel-bg); color: #a9b7c6; border: none;
    padding: 15px; font-family: 'Consolas', 'Courier New', monospace; font-size: 14px;
    resize: none; outline: none; line-height: 1.5;
  }

  /* プレビュー画面のレイアウト */
  .preview-container { flex: 1; background-color: #fff; display: flex; }
  iframe { width: 100%; height: 100%; border: none; }

  /* 児童配布用（全画面モード）のスタイル切り替え */
  body.full-screen-mode header,
  body.full-screen-mode .editors-container { display: none !important; }
  body.full-screen-mode .preview-container { height: 100vh; }
</style>
</head>
<body>

<header id="main-header">
  <div class="title-area">
    <h1>MyPen</h1>
    <input type="text" id="project-title" value="無題の作品" placeholder="作品タイトル">
    <button class="btn-save" onclick="saveProject()">💾 PC内保存</button>
  </div>
  
  <div class="storage-area">
    <select id="project-list" onchange="loadProject(this.value)">
      <option value="">-- 履歴から開く --</option>
    </select>
    <button class="btn-delete" onclick="deleteProject()">消去</button>
  </div>

  <div class="buttons">
    <button class="btn-import" onclick="document.getElementById('import-file').click()">📂 読込(.json)</button>
    <input type="file" id="import-file" style="display:none" accept=".json" onchange="importProject(event)">
    <button class="btn-export" onclick="exportProject()">📦 書出(.json)</button>
    <button class="btn-share" onclick="copyShareUrl()">🔗 短縮URLコピー</button>
    <button class="btn-app" onclick="downloadApp()">🌐 アプリ保存(.html)</button>
  </div>
</header>

<div class="editors-container" id="editors-box">
  <div class="editor">
    <div class="editor-header html-header">HTML</div>
    <textarea id="html-code" oninput="updatePreview()" placeholder="<h1>Hello</h1>"></textarea>
  </div>
  <div class="editor">
    <div class="editor-header css-header">CSS</div>
    <textarea id="css-code" oninput="updatePreview()" placeholder="h1 { color: red; }"></textarea>
  </div>
  <div class="editor">
    <div class="editor-header js-header">JS</div>
    <textarea id="js-code" oninput="updatePreview()" placeholder="console.log('Ready');"></textarea>
  </div>
</div>

<div class="preview-container">
  <iframe id="preview"></iframe>
</div>

<script>
  const STORAGE_KEY = 'mypen_local_history';

  // 1. プレビューのリアルタイム更新（srcdocによる安全な表示）
  function updatePreview() {
    const h = document.getElementById('html-code').value;
    const c = "<style>" + document.getElementById('css-code').value + "</style>";
    const j = "<script>" + document.getElementById('js-code').value + "<\/script>";
    document.getElementById('preview').srcdoc = h + c + j;
  }

  // 2. ブラウザ内（ローカルストレージ）への保存機能
  function saveProject() {
    const title = document.getElementById('project-title').value.trim() || '無題の作品';
    const h = document.getElementById('html-code').value;
    const c = document.getElementById('css-code').value;
    const j = document.getElementById('js-code').value;
    
    let history = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    history[title] = { h, c, j, updated: new Date().toLocaleTimeString() };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
    updateProjectList();
    alert('「' + title + '」を保存しました。');
  }

  // 3. 履歴プルダウンリストの更新機能
  function updateProjectList() {
    const select = document.getElementById('project-list');
    select.innerHTML = '<option value="">-- 履歴から開く --</option>';
    const history = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    for (const title in history) {
      const option = document.createElement('option');
      option.value = title;
      option.textContent = title + ' (' + history[title].updated + ')';
      select.appendChild(option);
    }
  }

  // 4. 履歴から作品を読み込む機能
  function loadProject(title) {
    if (!title) return;
    const history = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    const project = history[title];
    if (project) {
      document.getElementById('project-title').value = title;
      document.getElementById('html-code').value = project.h;
      document.getElementById('css-code').value = project.c;
      document.getElementById('js-code').value = project.j;
      updatePreview();
    }
  }

  // 5. 履歴の削除機能
  function deleteProject() {
    const select = document.getElementById('project-list');
    const title = select.value;
    if (!title) return;
    if (confirm('「' + title + '」の履歴を削除しますか？')) {
      let history = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      delete history[title];
      localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
      updateProjectList();
    }
  }

  // 6. JSONファイルへの書き出し機能（別PC用）
  function exportProject() {
    const data = {
      title: document.getElementById('project-title').value,
      html: document.getElementById('html-code').value,
      css: document.getElementById('css-code').value,
      js: document.getElementById('js-code').value
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (data.title || 'project') + '_data.json';
    a.click();
  }

  // 7. JSONファイルの読み込み機能（別PCから）
  function importProject(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const data = JSON.parse(e.target.result);
        document.getElementById('project-title').value = data.title || '無題';
        document.getElementById('html-code').value = data.html || '';
        document.getElementById('css-code').value = data.css || '';
        document.getElementById('js-code').value = data.js || '';
        updatePreview();
      } catch(err) {
        alert('読み込みに失敗しました。');
      }
    };
    reader.readAsText(file);
    event.target.value = '';
  }

  // 8. 短縮URL自動生成機能
  async function copyShareUrl() {
    const h = document.getElementById('html-code').value;
    const c = document.getElementById('css-code').value;
    const j = document.getElementById('js-code').value;
    
    // 日本語も安全に暗号化する処理
    const dataStr = JSON.stringify({ h, c, j });
    const base64 = btoa(unescape(encodeURIComponent(dataStr)));
    
    let baseUrl = window.location.href.split('?')[0];
    
    // GitHub Codespacesのプレビュー画面からリンクを作ろうとした場合の警告
    if(baseUrl.includes('github.dev') || baseUrl.includes('githubpreview.dev')) {
      alert('【注意】現在のURLは設定用の非公開プレビュー画面です。GitHub Pagesで公開された正規のURL上でこのボタンを押してください。');
      return;
    }
    
    const longUrl = baseUrl + '?mode=full&data=' + base64;
    
    try {
      // is.gdのAPIを使用してURLを短縮
      const response = await fetch('https://is.gd/create.php?format=json&url=' + encodeURIComponent(longUrl));
      const data = await response.json();
      
      if (data.shorturl) {
        navigator.clipboard.writeText(data.shorturl).then(() => {
          alert('短いURLを作成してコピーしました！\n' + data.shorturl);
        });
      } else {
        throw new Error('短縮エラー');
      }
    } catch (err) {
      // API制限等で短縮できなかった場合は長いURLをそのままコピー
      navigator.clipboard.writeText(longUrl).then(() => {
        alert('コードの量が制限を超えたため、短縮URLが作れませんでした。\n代わりに従来の長いURLをコピーしました。\n※確実に送る場合は「アプリ保存(.html)」をご利用ください。');
      });
    }
  }

  // 9. 完成品アプリとしてHTMLファイル単体を書き出す機能
  function downloadApp() {
    const html = document.getElementById('html-code').value;
    const css = document.getElementById('css-code').value;
    const js = document.getElementById('js-code').value;
    const fullHTML = `<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>学習アプリ</title><style>${css}</style></head><body>${html}<script>${js}<\/script></body></html>`;
    const blob = new Blob([fullHTML], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = (document.getElementById('project-title').value || 'app') + '.html';
    a.click();
    URL.revokeObjectURL(url);
  }

  // 10. 起動時のURLチェックと復元処理（エラーハンドリング強化）
  window.onload = function() {
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('mode') === 'full') {
      document.body.classList.add('full-screen-mode');
      const base64 = urlParams.get('data');
      if (base64) {
        try {
          const jsonStr = decodeURIComponent(escape(atob(base64)));
          const data = JSON.parse(jsonStr);
          const h = data.h || '';
          const c = "<style>" + (data.c || '') + "</style>";
          const j = "<script>" + (data.j || '') + "<\/script>";
          document.getElementById('preview').srcdoc = h + c + j;
        } catch (e) {
          // 暗号の解読に失敗（URLが途切れている）した場合の警告画面
          document.body.innerHTML = '<h2 style="color:white; text-align:center; margin-top:50px; line-height:1.6;">⚠️ エラー：URLが途切れているか、データが壊れています。<br>コードの量が多すぎる可能性があります。<br>リンクが完全にコピーされているか確認してください。</h2>';
        }
      }
    } else {
      updateProjectList();
      updatePreview();
    }
  };
</script>

</body>
</html>
